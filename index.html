<style>
:root {
  --bg-color: #fcfcfc;
  --text-color: #111111;
  --accent-color: #555555;
  --border-color: #eaeaea;
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans: 'Plus Jakarta Sans', Arial, sans-serif;
}

/* خلفية متدرجة متحركة للقسم الرئيسي */
.hero {
  background: linear-gradient(270deg, #fdfcfb, #e2d1c3);
  background-size: 400% 400%;
  animation: gradientMove 12s ease infinite;
}
@keyframes gradientMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

/* تأثير ظهور تدريجي للبطاقات */
.art-card {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s forwards;
}
.art-card:nth-child(1) {animation-delay: 0.3s;}
.art-card:nth-child(2) {animation-delay: 0.6s;}
.art-card:nth-child(3) {animation-delay: 0.9s;}
@keyframes fadeUp {
  to {opacity: 1; transform: translateY(0);}
}

/* أزرار نابضة */
.btn {
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: rgba(255,255,255,0.2);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0% {transform: scale(0);}
  50% {transform: scale(1);}
  100% {transform: scale(0);}
}
</style>
