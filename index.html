<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE EVARA — Original Art. Human Story.</title>
    <!-- استدعاء خطوط فخمة من جوجل تناسب صالات العرض العالمية -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fbfbfb;
            --text-color: #111111;
            --accent-color: #555555;
            --border-color: #eaeaea;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* شريط التنقل الفاخر */
        header {
            background-color: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-color);
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: var(--accent-color);
            font-size: 14px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--text-color);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .selector {
            border: none;
            background: transparent;
            font-family: var(--font-sans);
            font-size: 13px;
            color: var(--accent-color);
            cursor: pointer;
            outline: none;
        }

        /* الأزرار الراقية */
        .btn {
            display: inline-block;
            background-color: var(--text-color);
            color: #ffffff;
            padding: 12px 28px;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid var(--text-color);
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: transparent;
            color: var(--text-color);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.85);
            color: var(--text-color);
            border: 1px solid #111;
            backdrop-filter: blur(5px);
        }

        .btn-secondary:hover {
            background-color: #111;
            color: #fff;
        }

        /* الفكرة الذكية: واجهة الهيرو مع خلفية لوحة فنية كلاسيكية مشهورة مدمجة بنعومة */
        .hero {
            position: relative;
            text-align: center;
            padding: 160px 20px;
            /* استدعاء لوحة فنية كلاسيكية دافئة ومنظمة من الإنترنت كمثال */
            background-image: linear-gradient(rgba(255, 255, 255, 0.75), rgba(251, 251, 251, 1)), 
                              url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid var(--border-color);
        }

        .trust-badge-mini {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #111;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 16px;
            border: 1px solid #111;
        }

        .hero h1 {
            font-family: var(--font-serif);
            font-size: 58px;
            font-weight: 400;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 19px;
            color: #222;
            max-width: 650px;
            margin: 0 auto 40px auto;
            font-weight: 400;
        }

        /* الشبكة والمعرض */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .section-title {
            font-family: var(--font-serif);
            font-size: 36px;
            text-align: center;
            margin-bottom: 50px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .trust-section {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .trust-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            text-align: center;
        }

        .trust-item h3 {
            font-family: var(--font-serif);
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .trust-item p {
            font-size: 14px;
            color: var(--accent-color);
        }

        .art-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        .art-card {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .art-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .art-img-wrapper {
            position: relative;
            overflow: hidden;
            background: #eee;
        }

        .art-card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        .badge-verified {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            font-size: 11px;
            padding: 4px 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .art-info {
            padding: 25px;
            text-align: left;
        }

        .art-title {
            font-family: var(--font-serif);
            font-size: 22px;
            margin-bottom: 5px;
            font-weight: 400;
        }

        .art-artist {
            font-size: 14px;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .art-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-top: 15px;
        }

        .art-price {
            font-size: 18px;
            font-weight: 600;
        }

        /* نافذة الشراء (Checkout Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            width: 90%;
            max-width: 460px;
            border: 1px solid #111;
        }

        .modal h3 {
            font-family: var(--font-serif);
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            text-transform: uppercase;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            outline: none;
        }

        footer {
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
            padding: 60px 40px;
            margin-top: 60px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 40px;
            text-align: left;
        }

        .footer-col h4 {
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .footer-col a {
            display: block;
            text-decoration: none;
            color: var(--accent-color);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .footer-bottom {
            text-align: center;
            margin-top: 60px;
            font-size: 13px;
            color: var(--accent-color);
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">THE EVARA</a>
        <nav>
            <a href="#">Home</a>
            <a href="#shop">Shop</a>
