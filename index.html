<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE EVARA — Original Art. Human Story.</title>
    <!-- استدعاء خطوط فخمة من جوجل: خط Serif للعناوين و Sans-Serif للنصوص -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* التنسيقات العامة للموقع الفاخر */
        :root {
            --bg-color: #fcfcfc; /* لون Off-white خفيف وناعم للموقع */
            --text-color: #111111;
            --accent-color: #555555;
            --border-color: #eaeaea;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            /* أنيميشن خفيف جداً عند تحميل الموقع ليعطي شعور الهدوء */
            animation: fadeInPage 1.2s ease-in-out;
        }

        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 1) الهيدر العلوي والتنقل الفاخر */
        header {
            background-color: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-color);
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: var(--accent-color);
            font-size: 14px;
            font-weight: 400;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--text-color);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* قوائم الاختيار الذكية للغة والعملة */
        .selector {
            border: none;
            background: transparent;
            font-family: var(--font-sans);
            font-size: 13px;
            color: var(--accent-color);
            cursor: pointer;
            outline: none;
        }

        .selector:hover {
            color: var(--text-color);
        }

        /* الأزرار الأساسية الفخمة */
        .btn {
            display: inline-block;
            background-color: var(--text-color);
            color: #ffffff;
            padding: 12px 28px;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid var(--text-color);
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: transparent;
            color: var(--text-color);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--text-color);
        }

        /* مساحات عامة للمحتوى */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .section-title {
            font-family: var(--font-serif);
            font-size: 36px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        /* 2) قسم الهيرو (HERO SECTION) */
        .hero {
            text-align: center;
            padding: 120px 20px;
            background: linear-gradient(to bottom, #ffffff, var(--bg-color));
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-family: var(--font-serif);
            font-size: 56px;
            font-weight: 400;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 18px;
            color: var(--accent-color);
            max-width: 600px;
            margin: 0 auto 40px auto;
            font-weight: 300;
        }

        .hero-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        /* 3) قسم الثقة (TRUST SECTION) */
        .trust-section {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .trust-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            text-align: center;
        }

        .trust-item h3 {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .trust-item p {
            font-size: 14px;
            color: var(--accent-color);
            font-weight: 300;
        }

        /* شارات الأمان الدقيقة لتعزيز مصداقية المنصة */
        .trust-badge-mini {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 15px;
            background: #f4f4f4;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* 4) قسم معرض اللوحات (FEATURED ARTWORKS) */
        .art-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .art-card {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .art-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }

        .art-img-wrapper {
            position: relative;
            overflow: hidden;
            background: #eee;
        }

        .art-card img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            display: block;
        }

        .badge-verified {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            font-size: 11px;
            padding: 4px 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .art-info {
            padding: 25px;
            text-align: left;
        }

        .art-title {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .art-artist {
            font-size: 14px;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .art-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-top: 15px;
        }

        .art-price {
            font-size: 16px;
            font-weight: 600;
        }

        .art-info .btn {
            padding: 8px 16px;
            font-size: 11px;
            width: auto;
        }

        /* 5) قسم آلية العمل الذكي (HOW IT WORKS) */
        .how-section {
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .how-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
        }

        .how-column h3 {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .step {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .step-num {
            font-family: var(--font-serif);
            font-size: 24px;
            color: #ccc;
            line-height: 1;
        }

        .step-text h4 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .step-text p {
            font-size: 14px;
            color: var(--accent-color);
            font-weight: 300;
        }

        /* 6) قسم الفنانين (FOR ARTISTS SECTION) */
        .artists-pitch {
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }

        .artists-pitch p {
            font-size: 16px;
            color: var(--accent-color);
            margin-bottom: 30px;
            font-weight: 300;
        }

        .artists-points {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            font-size: 14px;
        }

        /* 7) قيم المنصة والفلسفة الفنية (PLATFORM VALUES) */
        .philosophy-section {
            background-color: #111111;
